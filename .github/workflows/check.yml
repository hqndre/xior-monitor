name: Xior Groningen Monitor

on:
  schedule:
    - cron: "0 * * * *"            # every hour, always (24/day baseline)
    - cron: "30 7-14 * * 1-5"      # extra check at :30 during NL business hours, Mon-Fri
                                    # 7-14 UTC = 9-16 Amsterdam time (summer)
                                    # ~895 calls/month total — fits in Scrape.do's 1000 free tier
  workflow_dispatch:        # also allows manual runs from the Actions tab

permissions:
  contents: write           # needed to commit state.json back

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          SCRAPE_DO_TOKEN: ${{ secrets.SCRAPE_DO_TOKEN }}
          SMTP_USER:       ${{ secrets.SMTP_USER }}
          SMTP_PASS:       ${{ secrets.SMTP_PASS }}
          TO_EMAIL:        ${{ secrets.TO_EMAIL }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          git config user.name  "xior-bot"
          git config user.email "[email protected]"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update state [skip ci]"
            git push
          else
            echo "no state changes"
          fi
